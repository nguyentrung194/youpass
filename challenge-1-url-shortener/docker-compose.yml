services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: youpass
      POSTGRES_PASSWORD: youpass
      POSTGRES_DB: youpass
    ports: ["5432:5432"]
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
